<figure class="write-path">
  <svg class="concept-art write-art-desktop" viewBox="0 0 800 160" role="img" aria-labelledby="write-art-title write-art-desc">
    <title id="write-art-title">The durable write path</title>
    <desc id="write-art-desc">An actor writes locally, waits for the bucket to hold the write, then confirms success to the caller.</desc>
    <path class="art-lines" d="M220 70h70m-10-8 10 8-10 8m220-8h70m-10-8 10 8-10 8"/>
    <g class="art-card"><rect x="10" y="20" width="210" height="100" rx="16"/><rect x="290" y="20" width="220" height="100" rx="16"/></g>
    <rect class="art-bucket" x="580" y="20" width="210" height="100" rx="16"/>
    <g class="art-label"><text x="115" y="64">Write locally</text><text x="400" y="64">Wait for the bucket</text><text x="685" y="64">Confirm success</text></g>
    <g class="art-detail"><text x="115" y="90">Actor’s database</text><text x="400" y="90">Recovery data stored</text><text x="685" y="90">Reply to the caller</text></g>
  </svg>
  <svg class="concept-art write-art-mobile" viewBox="0 0 320 340" role="img" aria-labelledby="write-mobile-title write-mobile-desc">
    <title id="write-mobile-title">Confirm a write after the bucket holds it</title>
    <desc id="write-mobile-desc">Write locally, wait for the bucket, then confirm success to the caller.</desc>
    <path class="art-lines" d="M160 90v30m-8-10 8 10 8-10m-8 90v30m-8-10 8 10 8-10"/>
    <g class="art-card"><rect x="20" y="10" width="280" height="80" rx="12"/><rect x="20" y="120" width="280" height="80" rx="12"/></g>
    <rect class="art-bucket" x="20" y="230" width="280" height="80" rx="12"/>
    <g class="art-label"><text x="160" y="44">Write locally</text><text x="160" y="154">Wait for the bucket</text><text x="160" y="264">Confirm success</text></g>
    <g class="art-detail"><text x="160" y="68">Actor’s database</text><text x="160" y="178">Recovery data stored</text><text x="160" y="288">Reply to the caller</text></g>
  </svg>
  <figcaption>A successful <code>exec-durable</code> completes after the bucket holds the write. The handler can then confirm it to the caller.</figcaption>
</figure>
