[package]
name = "website-front"
description = "The WasmKeep website's front: the Zola site, embedded, and the language wall's API."
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Built for wasm32-wasip2, so it is its own workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# Without the default `actor` feature: a front imports `actors`, `calls`
# and `env` only (world `wasmkeep:actor/front`).
wasmkeep-sdk = { version = "=0.4.2", default-features = false }

[build-dependencies]
# The cachebust hash Zola puts in `?h=` (the first 20 hex digits of the
# file's SHA-256), recomputed to tell a current fingerprint from a stale one.
sha2 = "0.10"

[profile.release]
opt-level = "s"
strip = true
lto = true
codegen-units = 1
