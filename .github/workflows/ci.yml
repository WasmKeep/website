name: CI

# Builds the site and the front, fetches the example components from the
# pinned WasmKeep release (checking their signatures), and runs the app
# with the released CLI for a smoke test. No deploy and no secrets here:
# the site is deployed by the maintainers, not from CI.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Tools run from their official images with podman (on the runner).
  ZOLA_IMAGE: ghcr.io/getzola/zola:v0.23.6
  COSIGN_IMAGE: ghcr.io/sigstore/cosign/cosign:v3.1.4
  REQUIRE_COSIGN: "1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: actionlint
        run: podman run --rm -v "$PWD:/repo:Z" -w /repo docker.io/rhysd/actionlint:1.7.12 -color
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: rustfmt
        run: |
          rustup toolchain install
          cargo fmt --manifest-path front/Cargo.toml --check
          cargo fmt --manifest-path room/Cargo.toml --check

  build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            front
            room
      - name: Build the site
        run: scripts/build-site.sh
      - name: Build the front
        run: |
          cd front
          cargo clippy --release --target wasm32-wasip2 -- -D warnings
          cargo build --release --target wasm32-wasip2
      - name: Build the room
        run: |
          cd room
          cargo clippy --release --target wasm32-wasip2 -- -D warnings
          cargo build --release --target wasm32-wasip2
      - name: Fetch and verify the components and the CLI
        run: scripts/fetch-components.sh --cli
      - name: Smoke test (wasmkeep dev)
        run: scripts/smoke.sh
